name: Build report PDF

on:
  push:
    branches: [main]
    paths:
      - "report/source.html"
      - ".github/workflows/build-report.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check weasyprint

      - name: Render PDF
        run: |
          mkdir -p report
          weasyprint report/source.html report/X_Algorithm_Breakdown_May_2026.pdf

      - name: Replace legacy report and commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f "X Algorithm/X_Algorithm_Breakdown.pdf" 2>/dev/null || true
          git add report/X_Algorithm_Breakdown_May_2026.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: publish revised X algorithm report"
          git push
